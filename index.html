<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eurovision Song Contest Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;800&family=Plus+Jakarta+Sans:wght@400;600;700&family=Protest+Strike&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06020f; --panel:#110624; --panel2:#1a0b35; --line:#32195f;
  --ink:#f8f5ff; --muted:#9d88dc; --pink:#ff2d95; --gold:#ffd166;
  --display:"Outfit","Segoe UI",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --number-font:"Protest Strike", sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;font-family:var(--body);color:var(--ink);background:
  radial-gradient(900px 420px at 50% -10%,rgba(255,45,149,.15),transparent 60%),
  radial-gradient(700px 380px at 10% 20%,rgba(110,50,220,.2),transparent 60%),var(--bg);
  min-height:100vh;line-height:1.42; overflow-x:hidden;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  pointer-events: none;
  z-index: -1;
  background: 
    radial-gradient(900px 420px at 30% 10%, rgba(255,45,149,.15), transparent 60%),
    radial-gradient(800px 400px at 80% 70%, rgba(110,50,220,.2), transparent 60%);
  animation: bgFloat 14s ease-in-out infinite alternate;
}
@keyframes bgFloat {
  0% { transform: translateY(0px) scale(1); filter: hue-rotate(0deg); }
  50% { transform: translateY(-25px) scale(1.04); filter: hue-rotate(15deg); }
  100% { transform: translateY(20px) scale(0.97); filter: hue-rotate(-10deg); }
}

#app { transition: opacity 0.3s ease; }
#app.enter { animation: popIn 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
@keyframes popIn {
  0% { opacity: 0; transform: translateY(10px) scale(0.99); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.wrap{max-width:1600px;margin:0 auto;padding:0 16px 80px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:.01em}
.who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem}
select,input{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%; transition: border-color 0.2s ease;}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }

input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 22px;
  height: 22px;
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 6px;
  cursor: pointer;
  display: inline-grid;
  place-content: center;
  transition: all 0.2s ease;
  vertical-align: middle;
  margin: 0;
}
input[type="checkbox"]:hover {
  border-color: var(--pink);
}
input[type="checkbox"]:checked {
  background: var(--pink);
  border-color: var(--pink);
  box-shadow: 0 0 12px rgba(255,45,149,0.4);
}
input[type="checkbox"]::before {
  content: "";
  width: 10px;
  height: 6px;
  border-left: 2px solid white;
  border-bottom: 2px solid white;
  transform: rotate(-45deg) scale(0);
  transition: transform 0.15s ease-in-out;
  margin-top: -2px;
}
input[type="checkbox"]:checked::before {
  transform: rotate(-45deg) scale(1);
}

button{
  font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:6px 12px;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease,filter .2s ease,background-color .2s ease,opacity .2s ease,border-color .2s ease;
}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 16px rgba(255,45,149,.25)}
button:active:not(:disabled){transform:scale(.92);box-shadow:none}

button.primary{background:#9e134c;border-color:#9e134c;color:#fff;font-weight:700}
button.ghost{background:transparent}
button.danger{color:#ffb3b3}
button:disabled{opacity:.35;cursor:not-allowed;transform:none!important;box-shadow:none!important}

.hero{
  font-family:var(--display);font-weight:800;font-size:clamp(2.8rem,8vw,5.6rem);line-height:1.05;margin:48px 0 24px;letter-spacing:-.02em;
  text-align:center;
  background:linear-gradient(135deg, #ff2d95 0%, #ffd166 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

h2{font-family:var(--display);font-size:1.5rem;margin:0}
h3{font-family:var(--display);margin:0 0 12px}
.hint{color:var(--muted);margin:0 0 14px;font-size:.9rem}
.yeartitle{font-family:var(--display);font-weight:800;font-size:clamp(2rem,6vw,3.4rem);margin:12px 0 16px;letter-spacing:-.01em}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}

.yearcard{cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:24px;min-height:140px;justify-content:center; transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease, border-color 0.25s ease;}
.yearcard:hover{transform:translateY(-6px); box-shadow:0 12px 24px rgba(0,0,0,0.4); border-color:var(--gold);}
.yearcard:active{transform:scale(0.96);}
.yearcard b{font-family:var(--display);font-size:2.2rem}
.yearcard span{color:var(--muted);font-size:1rem}

.fab{position:fixed;bottom:32px;right:32px;width:64px;height:64px;border-radius:50%;background:var(--pink);color:#fff;font-size:2.4rem;display:grid;place-items:center;border:none;box-shadow:0 10px 28px rgba(255,45,149,0.5);z-index:100;cursor:pointer;padding:0;margin:0}
.fab:hover{transform:scale(1.1) rotate(90deg);box-shadow:0 14px 32px rgba(255,45,149,0.7)}

.main-actions{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:32px;justify-content:center}
.main-actions button{font-family:var(--display);font-weight:700;font-size:1.15rem;padding:14px 24px;border-radius:12px;flex:1;max-width:300px;min-width:220px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs button{border-radius:999px;background:transparent}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.tabs button.final-tab{border-color:var(--gold);color:var(--gold);font-weight:700}
.tabs button.final-tab.on{background:var(--gold);color:var(--bg);border-color:var(--gold)}

.list{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px}
@media(max-width:1300px){.list{grid-template-columns:1fr}}

@keyframes simpleFadeUp { 
  from { opacity: 0; transform: translateY(8px); } 
  to { opacity: 1; transform: translateY(0); } 
}
.row{
  position: relative;
  overflow: hidden;
  display:grid;
  grid-template-columns:44px 1fr auto;
  gap:12px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 12px;
  align-items:center;
  animation: simpleFadeUp 0.3s ease-out backwards;
  transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
}

.row::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 220px;
  background-image: var(--flag-url);
  background-size: cover;
  background-position: center;
  opacity: 0.85;
  mask-image: linear-gradient(to right, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
  -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
  pointer-events: none;
  z-index: 0;
}

.row > * {
  position: relative;
  z-index: 1;
}

.cc-code{
  position: absolute;
  top: 50%;
  left: 72px;
  transform: translateY(-50%);
  font-family: var(--display);
  font-size: 0.65rem;
  font-weight: 800;
  background: rgba(0,0,0,0.65);
  color: var(--ink);
  padding: 3px 6px;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.2);
  letter-spacing: 0.05em;
  z-index: 2;
  text-shadow: none;
}

@media(max-width:700px){
  .row{grid-template-columns:1fr;gap:8px}
  .pl{justify-self:start!important}
}

.no{
  font-family:var(--display);
  font-weight:800;
  font-size:0.95rem;
  color:var(--ink);
  background: rgba(26, 11, 53, 0.55);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  border-radius:8px;
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  border:1px solid rgba(255, 255, 255, 0.15);
  flex-shrink:0;
  transition:color 0.2s, border-color 0.2s, background-color 0.2s;
}
.no:hover{border-color:var(--gold);color:var(--gold);background:rgba(26, 11, 53, 0.75)}

.row-content{
  display:flex;
  flex-direction:column;
  gap:6px;
  min-width:0;
  align-items:flex-end;
  text-align:right;
}

.meta{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  font-size:0.95rem;
  flex-wrap:wrap;
  min-width:0;
  text-shadow: 0 1px 3px rgba(0,0,0,0.95), 0 0 6px rgba(0,0,0,0.8);
  font-family: var(--display);
}
.meta b{font-size:1.05rem; font-weight: 800; letter-spacing: -0.01em;}
.flag{width:22px;height:15px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.25);vertical-align:middle;transform:scale(1.2);display:inline-block;margin:0 2px}

.stats{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.tiles{display:flex;gap:4px}

.tile{
  width:46px;
  height:50px;
  border-radius:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  border:2.5px solid transparent;
  padding:0;
  line-height:1;
  font-family:inherit;
  overflow:hidden;
}
.tile small{
  font-size:0.6rem;
  font-weight:700;
  width:100%;
  text-align:center;
  padding:3px 0;
  background: rgba(0,0,0,0.22);
  border-bottom: 1px solid rgba(0,0,0,0.15);
}
.tile.empty small{
  background: rgba(255,255,255,0.06);
  border-bottom-color: var(--line);
}
.tile b{
  font-family:var(--number-font); 
  font-size:1.35rem; 
  letter-spacing:0.05em;
  margin-bottom:3px;
}
.tile.empty{background:var(--panel2);color:var(--muted)}
.tile.me{border-color:#fff}

.tile.tip-hidden {
  opacity: 0;
  pointer-events: none;
  transform: scale(0.95);
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.row:hover .tile.tip-hidden {
  opacity: 1;
  pointer-events: auto;
  transform: scale(1);
}

.tile.tip-permanently-hidden {
  opacity: 0;
  pointer-events: none;
  transform: scale(0.95);
}

.avg{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:44px}
.avg b{font-family:var(--display);font-size:1.15rem}
.avg small{font-size:0.6rem;color:var(--muted);letter-spacing:.04em}

.pl{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  justify-self:end;
}
.pl input{width:56px;height:44px;text-align:center;font-family:var(--display);font-size:1.25rem;font-weight:800;color:var(--gold);background:var(--bg);border:2px solid var(--gold);border-radius:10px;padding:0}
.pl small{font-size:0.6rem;color:var(--gold);font-weight:700;letter-spacing:.05em}

.notes{
  color:var(--muted);
  font-size:0.8rem;
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:4px 12px;
  grid-column:1/-1;
  text-shadow: 0 1px 2px rgba(0,0,0,0.9);
  text-align: right;
  font-family: var(--body);
}

.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:.85rem}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
td.c,th.c{text-align:center}
.cell{display:inline-block;min-width:34px;padding:3px 8px;border-radius:8px;font-family:var(--number-font);font-size:1.1rem;text-align:center}
td input[type=number]{width:72px}
.dup{border-color:#ff6b6b;color:#ffb3b3}
.verdict{margin-top:14px;padding:16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:1.05rem}
.verdict b{font-family:var(--display);font-size:1.3rem}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.seg button.on{background:var(--pink);border-color:var(--pink);font-weight:700}
.autofinal{display:inline-block;background:#7b2cbf;color:#fff;border-radius:4px;padding:0 4px;font-size:0.65rem;font-weight:800;margin-left:4px;white-space:nowrap;flex-shrink:0}
.rank{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.rank .p{font-family:var(--display);font-weight:800;font-size:1.3rem;width:36px;color:var(--gold)}
.vs{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

dialog{
  background:var(--panel);
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:16px;
  padding:24px;
  width:min(440px,92vw);
  animation: scaleUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
dialog.wide{width:min(680px,92vw)}
dialog::backdrop{background:rgba(5,2,15,.85);backdrop-filter:blur(4px);animation:fadeIn .25s ease}
@keyframes scaleUp {
  from { opacity: 0; transform: scale(0.92) translateY(16px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

dialog label{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;color:var(--muted);font-size:.88rem}
dialog input,dialog select{width:100%}
.preset-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;margin:12px 0 16px}
.preset-btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--display);font-weight:700;color:var(--ink);cursor:pointer;text-align:center;font-size:1.1rem}
.preset-btn:hover{border-color:var(--pink);background:rgba(255,45,149,.15)}

.empty{color:var(--muted);padding:20px 0}
.sm-group{display:flex;gap:4px;margin-left:auto;flex-shrink:0}
.sm{padding:2px 6px;font-size:0.75rem}
.prow{display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--line)}
.pbtn{flex:1;display:flex;gap:10px;align-items:center;text-align:left;background:transparent;border:0;padding:8px 4px}
.pbtn small{color:var(--muted)}
#plist{max-height:55vh;overflow:auto;margin:10px 0}
.net{font-size:.8rem}

/* Such-Dropdown Styles */
.search-dropdown-container {
  position: relative;
  width: 100%;
}
.search-dropdown-results {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  max-height: 160px;
  overflow-y: auto;
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 8px;
  z-index: 9999;
  margin-top: 4px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.6);
  display: none;
}
.search-dropdown-results.active {
  display: block;
}
.search-dropdown-item {
  padding: 7px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: background 0.15s ease;
}
.search-dropdown-item:hover {
  background: rgba(255,45,149,0.25);
  color: var(--gold);
}

.ov-grid-side{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:24px;margin-top:16px}
@media(max-width:1200px){.ov-grid-side{grid-template-columns:1fr}}
.ov-column{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.ov-col-title{font-family:var(--display);font-weight:800;font-size:1.1rem;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;margin-bottom:16px;color:var(--ink)}

.ov-row-item{display:flex;align-items:center;gap:4px;margin-bottom:8px;justify-content:space-between}
.ov-pts{display:flex;gap:4px}
.ov-pt{width:34px;height:34px;display:grid;place-items:center;font-family:var(--number-font);font-size:1.1rem;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.ov-pt.none{color:var(--muted);opacity:0.4}
.ov-pill{flex:1;height:38px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 10px;font:700 0.85rem var(--display);overflow:hidden;}
.ov-pill .song-info{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;}
.ov-pill .song-info span{overflow:hidden;text-overflow:ellipsis;font-size:0.8rem;font-weight:400;color:var(--muted);}
.ov-pill .song-info b{font-size:0.85rem;color:var(--ink);font-weight:600;}
.ov-pill.out{opacity:0.4;background:var(--bg)}
.ov-pill .flag{width:22px;height:15px;object-fit:cover;border-radius:2px;flex-shrink:0;}
.ov-place{width:36px;text-align:center;font-weight:800;color:var(--gold);font-size:0.9rem}

@keyframes goldGlow {
  0% { box-shadow: 0 0 10px rgba(255, 209, 102, 0.4); border-color: var(--gold); }
  50% { box-shadow: 0 0 22px rgba(255, 209, 102, 0.8); border-color: #fff6cc; }
  100% { box-shadow: 0 0 10px rgba(255, 209, 102, 0.4); border-color: var(--gold); }
}
.row.winner {
  border: 2px solid var(--gold);
  animation: goldGlow 2.5s infinite ease-in-out;
}
.row.winner .meta b {
  background: linear-gradient(135deg, #ffd166 0%, #ffae00 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 2px 10px rgba(255,209,102,0.3);
}

.row.out {
  opacity: 0.35;
  filter: grayscale(0.8) blur(0.3px);
  background: rgba(17,6,36,0.3);
  border-color: rgba(50, 25, 95, 0.6);
}
.row.out .tiles { filter: none !important; opacity: 1 !important; }

.row.dq {
  opacity: 0.25;
  filter: grayscale(1) blur(0.5px);
  background: rgba(214, 40, 57, 0.05);
  border-color: rgba(214, 40, 57, 0.3);
}
.row.autofinal-row{border-color:#9d4edd}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>

  <div id="app"></div>

<dialog id="dlg"></dialog>

function sortShowsList(list){

    var nb = (b.customNo !== undefined && b.customNo !== null && b.customNo !== "") ? parseFloat(b.customNo) : idx(b.id);
    if (!isNaN(na) && !isNaN(nb)) return na - nb;
    return String(na).localeCompare(String(nb));
  });
}

function toTree(){
  var t={jury:{},songs:{},years:{},ratings:S.ratings,notes:S.notes,pred:S.pred,qualPred:S.qualPred};
  for(var i=0; i<S.jury.length; i++){ t.jury[S.jury[i].id] = {name:S.jury[i].name}; }
  for(var i=0; i<S.songs.length; i++){ var x = S.songs[i]; t.songs[x.id] = {cc:x.cc, artist:x.artist, title:x.title, year:x.year}; }
  for(var i=0; i<S.years.length; i++){
    var y = S.years[i];
    var o={year:y.year, suffix:y.suffix, city:y.city, splitAfter: y.splitAfter, shows:{}};
    for(var sh in y.shows){
      o.shows[sh]={};
      var shList = y.shows[sh];
      for(var k=0; k<shList.length; k++){
        var e = shList[k]; o.shows[sh][e.id] = {n:e.customNo, songId:e.songId, place:e.place, dq:e.dq, autoFinal: e.autoFinal};
      }
    }
    t.years[y.id]=o;
  }
  return t;
}

function flat(o,p,out){
  p=p||""; out=out||{};
  for(var k in o){
    var v=o[k],q=p?p+"/"+k:k;
    if(v&&typeof v==="object")flat(v,q,out);
    else if(v!==undefined&&v!==null&&v!=="")out[q]=v;
  }
  return out;
}

function fromTree(t){
  var r=fresh(),ju=t.jury||{};
  for(var i=0; i<r.jury.length; i++){ if(ju[r.jury[i].id] && ju[r.jury[i].id].name) r.jury[i].name = ju[r.jury[i].id].name; }
  r.songs=[]; var tSongs = t.songs || {};
  for(var id in tSongs){ if(tSongs.hasOwnProperty(id)) r.songs.push(Object.assign({id:id}, tSongs[id])); }
  r.years=[]; var tYears = t.years || {};
  for(var id in tYears){
    if(tYears.hasOwnProperty(id)){
      var o = tYears[id]; var shows={};
      if(o.shows){
        for(var sh in o.shows){
          if(o.shows.hasOwnProperty(sh)){
            var shObj = o.shows[sh] || {}; var arr = [];
            for(var id2 in shObj){
              if(shObj.hasOwnProperty(id2)){
                var e = shObj[id2];
                arr.push({id:id2, songId:e.songId, place:e.place, customNo:e.n, dq:e.dq, autoFinal: e.autoFinal});
              }
            }
            sortShowsList(arr);
            shows[sh] = arr;
          }
        }
      }
      r.years.push({id:id, year:+o.year||+id.split("_")[0], suffix:o.suffix||"", city:o.city, splitAfter: o.splitAfter, shows:shows});
    }
  }
  r.years.sort(function(a,b){return b.year-a.year||b.id.localeCompare(a.id);});
  r.ratings=t.ratings||{}; r.notes=t.notes||{}; r.pred=t.pred||{}; r.qualPred=t.qualPred||{};
  return r;
}

function same(a,b){
  var k=Object.keys(a); if(k.length !== Object.keys(b).length) return false;
  for(var i=0; i<k.length; i++){ if(a[k[i]] !== b[k[i]]) return false; }
  return true;
}

function push(){
  if(!DB)return;
  var cur=flat(toTree()),p={};
  for(var k in cur)if(cur[k]!==lastFlat[k])p[k]=cur[k];
  for(var k in lastFlat)if(!(k in cur))p[k]=null;
  if(!Object.keys(p).length)return;
  var prev=lastFlat;lastFlat=cur;busy++;
  fetch(DB+"/.json",{method:"PATCH",body:JSON.stringify(p)}).then(function(r){if(!r.ok)throw 0;net="online";}).catch(function(){lastFlat=prev;net="error";}).finally(function(){busy--;badge();});
}

function pull(first){
  if(!DB||busy)return;
  fetch(DB+"/.json").then(function(res){return res.json();}).then(function(t){
    net="online";
    if(!t){if(first===true)push();badge();return;}
    var f=flat(t);
    if(same(f,lastFlat)){badge();return;}
    var a=document.activeElement;
    if(first!==true&&(dlg.open||(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))))return;
    S=fromTree(t);lastFlat=f;
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    render();
  }).catch(function(){net="error";badge();});
}

var pc=function(p){
  var t=Math.max(0,Math.min(1,(p-1)/9));
  var R=[214,40,57],W=[255,255,255],G=[24,150,80];
  var mix=function(a,b,k){return [Math.round(a[0]+(b[0]-a[0])*k), Math.round(a[1]+(b[1]-a[1])*k), Math.round(a[2]+(b[2]-a[2])*k)];};
  var rgb=t<.5?mix(R,W,t*2):mix(W,G,(t-.5)*2);
  var r=rgb[0],g=rgb[1],b=rgb[2];
  var lum=(r*299+g*587+b*114)/1000;
  var style = "background:rgb("+r+","+g+","+b+");color:"+(lum>150?"#1d1d1d":"#fff");
  if(Number(p) === 10){ style += ";border:2.5px solid var(--gold);box-shadow:0 0 10px rgba(255,209,102,0.8)"; }
  return style;
};

    return '<div class="ov-column">' +

      getPtsHeader(isMirror) +
      '<div style="display:flex;flex-direction:column;gap:8px">'+rows+'</div>' +

  };

  var gridCols = '';
  if(y.shows.sf1 && y.shows.sf2){
    gridCols = renderSideCol("sf1", "Semi-final 1", false) + renderSideCol("sf2", "Semi-final 2", true);
  } else if(y.shows.sf1){

  } else if(y.shows.sf2){

  }

  return '<h2>Overview</h2><p class="hint">Everyone\'s points side by side. Disqualified or non-qualifying countries are greyed out.</p>' +
    subTabsHtml +
    '<div class="ov-grid-side">' + gridCols + '</div>';
}

function showView(sh){

        else { tiles += '<div class="'+cls+'" style="'+(v?pc(v):"")+'" title="'+esc(jur.name)+'">'+inner+'</div>'; }
      }
      mainStatsHtml = '<div class="tiles">'+tiles+'</div><div class="avg"><b>'+(avg==null?"–":avg.toFixed(1))+'</b><small>AVG</small></div>';

    var notesStr = "";

    }

    var afTag = (sh !== "final" && isAutoFinal) ? '<span class="autofinal">AQ</span>' : "";
    var placeVal = (e.place !== undefined && e.place !== null) ? e.place : "";

    var rowClass = (e.place===1?" winner":"")+(isOut?" out":"")+(e.dq?" dq":"")+(sh !== "final" && isAutoFinal && e.place !== 1 ? " autofinal-row":"");

function battle(){
  var y=yearObj(ui.yearId), allFin=y.shows.final || [];
  var fin = [];
  for(var i=0; i<allFin.length; i++){if(songById(allFin[i].songId) && !allFin[i].dq) fin.push(allFin[i]);}

  fin.sort(function(a, b) {
    var pa = (a.place !== undefined && a.place !== null) ? a.place : 9999;
    var pb = (b.place !== undefined && b.place !== null) ? b.place : 9999;
    return pa - pb;
  });

  var dupSets = {};
  for(var j=0; j<S.jury.length; j++){
    var jId = S.jury[j].id;
    var c = {};
    for(var i=0; i<fin.length; i++){
      var v = (S.pred[fin[i].id] || {})[jId];
      if(v) c[v] = (c[v] || 0) + 1;
    }
    dupSets[jId] = c;
  }

  var guessHeaders = "";
  var diffHeaders = "";
  for(var j=0; j<S.jury.length; j++){
    guessHeaders += '<th class="c">'+esc(S.jury[j].name)+' (Tipp)</th>';
    diffHeaders += '<th class="c">'+esc(S.jury[j].name)+' (Abw.)</th>';
  }

  var rows="";
  var jurorTotals = {};
  for(var j=0; j<S.jury.length; j++){ jurorTotals[S.jury[j].id] = {sum: 0, count: 0}; }

  for(var i=0; i<fin.length; i++){
    var e=fin[i], s=songById(e.songId), p=S.pred[e.id]||{}, act=e.place;
    var guessCells="";
    var diffCells="";
    
    for(var j=0; j<S.jury.length; j++){
      var jId = S.jury[j].id;
      var v = p[jId];
      var valStr = (v !== undefined && v !== null) ? v : "";
      var isDup = v && dupSets[jId][v] > 1;
      
      guessCells += '<td class="c"><input type="number" min="1" max="'+fin.length+'" value="'+valStr+'" class="'+(isDup?"dup":"")+'" data-chg="pred" data-e="'+e.id+'" data-j="'+jId+'" style="width:60px;text-align:center"></td>';
      
      var diffCell = "–";
      if(v !== undefined && v !== null && act !== undefined && act !== null){
        var d = Math.abs(v - act);
        jurorTotals[jId].sum += d;
        jurorTotals[jId].count++;
        if(d === 0){
          diffCell = '<span class="cell" style="'+pc(10)+';font-size:0.85rem;padding:3px 8px;">🎯 0</span>';
        } else {
          diffCell = '<span class="cell" style="'+pc(Math.max(1, 10 - d))+';font-size:0.85rem;padding:3px 8px;">'+d+'</span>';
        }
      }
      diffCells += '<td class="c">'+diffCell+'</td>';
    }
    var placeActStr = (act!==undefined&&act!==null)?act:"–";
    rows+='<tr><td>'+flag(s.cc)+' '+esc(CN[s.cc]||s.cc)+'</td>'+guessCells+diffCells+'<td class="c"><b>'+placeActStr+'</b></td></tr>';
  }

  var rankings = [];
  for(var j=0; j<S.jury.length; j++){
    var jId = S.jury[j].id;
    if(jurorTotals[jId].count > 0){
      rankings.push({name: S.jury[j].name, sum: jurorTotals[jId].sum, count: jurorTotals[jId].count});
    }
  }
  rankings.sort(function(a, b){ return a.sum - b.sum; });

  var verdictHtml = '<span class="hint">Trage die Tipps und tatsächlichen Plätze ein, um das Leaderboard zu sehen.</span>';
  if(rankings.length > 0){
    var rankList = "";
    for(var r=0; r<rankings.length; r++){
      var item = rankings[r];
      var medal = r === 0 ? "👑 " : (r === 1 ? "🥈 " : (r === 2 ? "🥉 " : ""));
      rankList += '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)"><span>'+medal+'<b>'+esc(item.name)+'</b></span><span><b>'+item.sum+'</b> Fehlerpunkte ('+item.count+' verglichen)</span></div>';
    }
    verdictHtml = '<h3 style="margin-bottom:8px">Leaderboard</h3><div style="display:flex;flex-direction:column;gap:4px">'+rankList+'</div>';
  }

  return '<h2>Points Battle</h2><p class="hint">Tippe die Platzierungen nebeneinander. Die Abweichungen werden in separaten Spalten rechts daneben angezeigt (🎯 bei Volltreffer). Songs sind nach dem tatsächlichen Ergebnis sortiert (Platz 1 oben).</p>'+
  (fin.length?'<div class="tw" style="margin-top:12px"><table><thead><tr><th>Country</th>'+guessHeaders+diffHeaders+'<th class="c">Actual</th></tr></thead>'+
  '<tbody>'+rows+'</tbody></table></div>'+
  '<div class="verdict">'+verdictHtml+'</div>'
  :'<p class="empty">Bitte wähle zuerst Songs für das Grand Final aus.</p>');
}

function scoreboard(){
  var y=yearObj(ui.yearId), sh=ui.sbShow;
  if(sh !== "all" && !y.shows[sh]) sh = y.shows.final ? "final" : Object.keys(y.shows)[0];
  
  var rawList = [];
  if(sh === "all"){
    var seenSongs = new Set();
    for(var sKey in y.shows){
      var sList = y.shows[sKey] || [];
      for(var k=0; k<sList.length; k++){
        if(sList[k].songId && !seenSongs.has(sList[k].songId)){
          seenSongs.add(sList[k].songId);
          rawList.push(sList[k]);
        }
      }
    }
  } else {
    rawList = y.shows[sh] || [];
  }

  var rows = [];
  for(var i=0; i<rawList.length; i++){
    var e = rawList[i];
    if(songById(e.songId) && !e.dq){
      var r = getRatings(e);
      var vals = [];
      for(var j=0; j<S.jury.length; j++){if(r[S.jury[j].id]) vals.push(r[S.jury[j].id]); }
      var sum = 0; for(var v=0; v<vals.length; v++){ sum+=vals[v]; }
      rows.push({e:e, s:songById(e.songId), r:r, avg:vals.length?sum/vals.length:null, sum:sum});
    }
  }
  rows.sort(function(a,b){ return ((b.avg!==null?b.avg:-1)-(a.avg!==null?a.avg:-1)); });
  var juryHeaders = "";
  for(var j=0; j<S.jury.length; j++){ juryHeaders += '<th class="c">'+esc(S.jury[j].name)+'</th>'; }
  var tbody = "";
  for(var i=0; i<rows.length; i++){
    var x = rows[i];
    var jCols = "";
    for(var j=0; j<S.jury.length; j++){
      var p = x.r[S.jury[j].id];
      jCols += '<td class="c">'+(p?'<span class="cell" style="'+pc(p)+'">'+p+'</span>':"–")+'</td>';
    }
    tbody += '<tr><td>'+(x.avg==null?"–":i+1)+'</td><td>'+flag(x.s.cc)+' '+esc(CN[x.s.cc])+'</td><td>'+esc(x.s.title)+'</td>'+jCols+'<td class="c">'+(x.avg==null?"–":x.sum)+'</td><td class="c">'+(x.avg==null?"–":'<span class="cell" style="'+pc(x.avg)+'">'+x.avg.toFixed(1)+'</span>')+'</td></tr>';
  }
  return '<h2>Scoreboard</h2><p class="hint">Average points, highest first.</p>'+switcher("sbShow")+
  (rows.length?'<div class="tw"><table><thead><tr><th>#</th><th>Country</th><th>Song</th>'+juryHeaders+'<th class="c">Total</th><th class="c">Ø</th></tr></thead><tbody>'+tbody+'</tbody></table></div>':'<p class="empty">Nothing to show yet.</p>');
}

function compareView(){
  var currentCountryName = (ui.compareCc && CN[ui.compareCc]) ? CN[ui.compareCc] : "";
  
  var entries = [];
  if (ui.compareCc) {
    for(var i=0; i<S.years.length; i++){
      var y = S.years[i];
      var yearEntries = [];
      
      for(var sh in y.shows){
        var list = y.shows[sh];
        for(var k=0; k<list.length; k++){
          var entry = list[k], song = songById(entry.songId);
          if(song && song.cc === ui.compareCc){
            yearEntries.push({yearObj: y, showKey: sh, showName: SHOWS[sh], entry: entry, song: song});
          }
        }
      }
      
      if(yearEntries.length > 0){
        var chosen = null;
        for(var k=0; k<yearEntries.length; k++){
          if(yearEntries[k].showKey === "final"){
            chosen = yearEntries[k];
            break;
          }
        }
        if(!chosen){
          chosen = yearEntries[0];
        }
        entries.push(chosen);
      }
    }
  }

  entries.sort(function(a,b){ return b.yearObj.year - a.yearObj.year; });
  var rowsHtml = "";
  for(var i=0; i<entries.length; i++){
    var item = entries[i], r = getRatings(item.entry);
    var vals = []; for(var j=0; j<S.jury.length; j++){ if(r[S.jury[j].id]) vals.push(r[S.jury[j].id]); }
    var sum = 0; for(var v=0; v<vals.length; v++){ sum+=vals[v]; }
    var avg = vals.length ? sum/vals.length : null;
    var jCols = "";
    for(var j=0; j<S.jury.length; j++){
      var p = r[S.jury[j].id];
      jCols += '<td class="c">'+(p?'<span class="cell" style="'+pc(p)+'">'+p+'</span>':"–")+'</td>';
    }
    rowsHtml += '<tr><td><b>'+item.yearObj.year+'</b><br><small>'+item.showName+'</small></td><td>'+flag(item.song.cc)+' <b>'+esc(item.song.title)+'</b></td>'+jCols+'<td class="c"><b>'+(avg==null?"–":sum)+'</b></td><td class="c">'+(avg==null?"–":'<span class="cell" style="'+pc(avg)+'">'+avg.toFixed(1)+'</span>')+'</td></tr>';
  }
  var juryHeaders = ""; for(var j=0; j<S.jury.length; j++){ juryHeaders += '<th class="c">'+esc(S.jury[j].name)+'</th>'; }
  
  var contentHtml = !ui.compareCc 
    ? '<p class="empty">Bitte wähle oben ein Land aus, um den Vergleich zu sehen.</p>'
    : (rowsHtml ? '<div class="tw"><table><thead><tr><th>Year / Show</th><th>Song</th>'+juryHeaders+'<th class="c">Total</th><th class="c">Ø</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div>' : '<p class="empty">No entries found for this country.</p>');

  return '<div style="padding-top:14px"><button class="ghost" data-act="home">← Back</button></div>'+
  '<h2>Country Comparison</h2>'+
  '<div style="margin-bottom:16px;max-width:300px;"><label>Select Country:'+
    '<div class="search-dropdown-container">'+
      '<input id="compare_country_input" placeholder="Land suchen..." value="'+esc(currentCountryName)+'" autocomplete="off" style="width:100%">'+
      '<div id="compare_country_results" class="search-dropdown-results"></div>'+
    '</div>'+
  '</label></div>'+ contentHtml;
}

function openSettings(){
  var jLabels = ""; for(var i=0; i<S.jury.length; i++){ jLabels += '<label>'+S.jury[i].id.toUpperCase()+' Name<input data-jn="'+S.jury[i].id+'" value="'+esc(S.jury[i].name)+'"></label>'; }
  dlg.className="";
  dlg.innerHTML='<h3>Settings</h3>'+jLabels+'<label>Database URL<input id="dburl" value="'+esc(DB)+'"></label>'+
   '<div class="actions"><button data-act="export">Export</button><label style="background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;flex:1;text-align:center">Import<input id="imp" type="file" style="display:none"></label><button class="ghost" data-act="openJsonEditor">JSON bearbeiten</button></div>'+
   '<div class="actions"><button class="ghost" data-act="closeDlg">Close</button><button class="primary" data-act="saveNames">Save</button></div>';
  if(!dlg.open)dlg.showModal();
  
  $("#imp").addEventListener("change",function(ev){
    var f=ev.target.files[0]; if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var imported=JSON.parse(r.result);
        
        var juryMap={};
        S.jury.forEach(function(j){ juryMap[j.id]=j; });
        if(imported.jury){ imported.jury.forEach(function(j){ juryMap[j.id]=j; }); }
        S.jury=Object.values(juryMap);

        var songMap={};
        S.songs.forEach(function(s){ songMap[s.id]=s; });
        if(imported.songs){ imported.songs.forEach(function(s){ songMap[s.id]=s; }); }
        S.songs=Object.values(songMap);

        var yearMap={};
        S.years.forEach(function(y){ yearMap[y.id]=y; });
        if(imported.years){ imported.years.forEach(function(y){ yearMap[y.id]=y; }); }
        S.years=Object.values(yearMap);
        S.years.sort(function(a,b){return b.year-a.year||b.id.localeCompare(a.id);});

        ['ratings','notes','pred','qualPred'].forEach(function(key){
          S[key]=S[key]||{};
          if(imported[key]){
            for(var id in imported[key]){
              if(imported[key].hasOwnProperty(id)){
                S[key][id]=Object.assign({}, S[key][id]||{}, imported[key][id]);
              }
            }
          }
        });

        save();
        dlg.close();
        render();
        showAlert("Success", "Data successfully merged!");
      }catch(e){showAlert("Error","Invalid file");}
    };
    r.readAsText(f);
  });
}

    var e=findEntry(t.dataset.e), inp=$("#custom_no_input"), afChk=$("#custom_autofinal_input");
    if(e){
      if(inp){ 
        var v = inp.value.trim(); 
        var parsedNum = parseFloat(v);
        if(v === "" || (parsedNum === idx(e.id))) delete e.customNo; 
        else e.customNo = !isNaN(parsedNum) ? parsedNum : v; 
      }
      if(afChk){ 
        e.autoFinal=afChk.checked; 
        if(e.autoFinal) {
          delete e.place;
        }
      }
      
      for(var i=0; i<S.years.length; i++){
        var y = S.years[i];
        for(var sh in y.shows){
          var list = y.shows[sh];
          for(var k=0; k<list.length; k++){
            if(list[k].id === e.id){ sortShowsList(list); break; }
          }
        }
      }
      save();
    }
    dlg.close();
  },
  toggleDq:function(t){ var e=findEntry(t.dataset.e); e.dq=!e.dq; save(); },
  addSong:function(){openSong(null,ui.assign);return "keep";},
  editSong:function(t){openSong(t.dataset.id,null);return "keep";},
  pick:function(t){openPicker(t.dataset.e);return "keep";},
  choose:function(t){
    var e=findEntry(ui.assign), id=t.dataset.id;
    e.songId=id; save(); dlg.close(); return "keep";
  },
  delSong:function(t){
    var id=t.dataset.id;
    openConfirm("Delete Song","Delete from library?",function(){
      S.songs=S.songs.filter(function(x){return x.id!==id;}); save(); fillList();
    });
    return "keep";
  },
  saveSong:function(){
    var artist=$("#f_artist").value.trim(), title=$("#f_title").value.trim(), cc=$("#f_cc").value;
    var songYear=parseInt($("#f_song_year").value)||new Date().getFullYear();
    if(!artist||!title||!cc) return "keep";
    if(ui.editSong){ var x=songById(ui.editSong); x.artist=artist; x.title=title; x.cc=cc; x.year=songYear; }
    else {
      var id="s"+Date.now().toString(36);
      S.songs.push({id:id,cc:cc,artist:artist,title:title,year:songYear});
      if(ui.assign){ var e=findEntry(ui.assign); if(e) e.songId=id; }
    }
    save(); if(ui.assign) dlg.close(); else render(); return "keep";
  },
  editCity:function(){
    var y=yearObj(ui.yearId);
    dlg.className="";
    dlg.innerHTML='<h3>Host City</h3><label>City<input id="city_input" value="'+esc(y.city||"")+'"></label><div class="actions"><button class="ghost" data-act="closeDlg">Cancel</button><button class="primary" data-act="saveCity">Save</button></div>';
    if(!dlg.open) dlg.showModal(); return "keep";
  },
  saveCity:function(){ var y=yearObj(ui.yearId), inp=$("#city_input"); if(y&&inp){ y.city=inp.value.trim()||undefined; save(); } dlg.close(); },
  closeDlg:function(){dlg.close();return "keep";},
  confirmYes:function(){ dlg.close(); if(_pendingConfirmCallback){ var cb=_pendingConfirmCallback; _pendingConfirmCallback=null; cb(); } return "keep"; },
  settings:function(){openSettings();return "keep";},
  openJsonEditor:function(){openJsonEditor();return "keep";},
  saveRawJson:function(){
    try {
      var rawText = $("#raw_json_input").value;
      var imported = JSON.parse(rawText);
      if(imported.jury) S.jury = imported.jury;
      if(imported.songs) S.songs = imported.songs;
      if(imported.years) {
        S.years = imported.years;
        S.years.sort(function(a,b){return b.year-a.year||b.id.localeCompare(a.id);});
      }
      if(imported.ratings) S.ratings = imported.ratings;
      if(imported.notes) S.notes = imported.notes;
      if(imported.pred) S.pred = imported.pred;
      if(imported.qualPred) S.qualPred = imported.qualPred;

      save();
      dlg.close();
      render();
      showAlert("Erfolg", "JSON erfolgreich aktualisiert und gespeichert!");
    } catch(e) {
      showAlert("Fehler", "Ungültiges JSON-Format: " + e.message);
    }
    return "keep";
  },
  saveNames:function(){
    var inputs = document.querySelectorAll("[data-jn]");
    for(var i=0; i<inputs.length; i++){
      var jId = inputs[i].dataset.jn, val = inputs[i].value.trim();
      if(val){ for(var k=0; k<S.jury.length; k++){ if(S.jury[k].id===jId) S.jury[k].name=val; } }
    }
    save(); dlg.close(); return "keep";
  },
  export:function(){
    var blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="esc.json"; a.click(); return "keep";
  }
};

function setupCountrySearch(inputId, resultsId, hiddenInputId, onSelectCallback) {
  var input = $(inputId);
  var resultsBox = $(resultsId);
  var hiddenInput = $(hiddenInputId);
  if (!input || !resultsBox) return;

  function renderDropdown(filterText) {
    var query = (filterText || "").toLowerCase();
    var filtered = COUNTRIES.filter(function(c){
      return c[1].toLowerCase().indexOf(query) !== -1;
    });

    var html = "";
    for(var i=0; i<filtered.length; i++){
      html += '<div class="search-dropdown-item" data-cc="'+filtered[i][0]+'" data-name="'+esc(filtered[i][1])+'">'+flag(filtered[i][0])+' <span>'+esc(filtered[i][1])+'</span></div>';
    }
    resultsBox.innerHTML = html ? html : '<div class="search-dropdown-item" style="color:var(--muted)">Kein Land gefunden</div>';
    resultsBox.classList.add("active");
  }

  input.addEventListener("focus", function(){
    renderDropdown(input.value);
  });

  input.addEventListener("click", function(){
    renderDropdown(input.value);
  });

  input.addEventListener("input", function(){
    renderDropdown(input.value);
    if(hiddenInput) hiddenInput.value = "";
  });

  resultsBox.addEventListener("mousedown", function(ev){
    // mousedown nutzen, damit das Schließen zuverlässig vor dem Blur greift
    var item = ev.target.closest(".search-dropdown-item");
    if(!item || !item.dataset.cc) return;
    var cc = item.dataset.cc;
    var name = item.dataset.name;
    input.value = name;
    if(hiddenInput) hiddenInput.value = cc;
    resultsBox.classList.remove("active");
    if(onSelectCallback) onSelectCallback(cc);
  });

  input.addEventListener("blur", function(){
    // Kurzer Timeout, damit Klicks auf die Liste noch registriert werden können
    setTimeout(function(){
      resultsBox.classList.remove("active");
    }, 200);
  });

  document.addEventListener("click", function(ev){
    if(!input.contains(ev.target) && !resultsBox.contains(ev.target)){
      resultsBox.classList.remove("active");
    }
  });
}

document.addEventListener("input",function(ev){
  if(ev.target.id === "lib_search_input"){ ui.q = ev.target.value; render(); var inp=$("#lib_search_input"); if(inp){ inp.focus(); inp.selectionStart=inp.selectionEnd=inp.value.length; } }
  if(ev.target.dataset.chg === "splitAfter"){
    var y = yearObj(ui.yearId);
    if(y){
      y.splitAfter = y.splitAfter || {};
      y.splitAfter[ev.target.dataset.show] = parseInt(ev.target.value) || 1;
      save();
      render();
    }
  }
});

document.addEventListener("change",function(ev){
  if(ev.target.id === "lib_year_select"){ ui.libYear = ev.target.value; render(); }
  var t=ev.target.closest("[data-chg]"); if(!t) return;
  if(t.dataset.chg === "splitAfter") return;
  if(C[t.dataset.chg](t)!=="keep") render();
});

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-act]"); 
  if(!t||!A[t.dataset.act]) return;
  var r=A[t.dataset.act](t);
  if(r!=="keep") render();
});

var C={
  place:function(t){ 
    var e=findEntry(t.dataset.e), v=parseInt(t.value); 
    if(v>0) e.place=v; else delete e.place; 
    save(); 
    return "keep"; 
  },
  pred:function(t){ var id=t.dataset.e, j=t.dataset.j, v=parseInt(t.value); S.pred[id]=S.pred[id]||{}; if(v>0) S.pred[id][j]=v; else delete S.pred[id][j]; save(); }
};

var origRender = render;
render = function() {
  origRender();
  if(ui.view === "compare"){
    setupCountrySearch("#compare_country_input", "#compare_country_results", null, function(cc){
      ui.compareCc = cc;
      render();
    });
  }
};

render();
checkFirstJoin();
if(DB){pull(true);setInterval(pull,4000);}
