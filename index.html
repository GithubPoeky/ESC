<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eurovision Song Contest Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;800&family=Plus+Jakarta+Sans:wght@400;600;700&family=Protest+Strike&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06020f; --panel:#110624; --panel2:#1a0b35; --line:#32195f;
  --ink:#f8f5ff; --muted:#9d88dc; --pink:#ff2d95; --gold:#ffd166;
  --display:"Outfit","Segoe UI",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --number-font:"Protest Strike", sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font-family:var(--body);color:var(--ink);background:
  radial-gradient(900px 420px at 50% -10%,rgba(255,45,149,.15),transparent 60%),
  radial-gradient(700px 380px at 10% 20%,rgba(110,50,220,.2),transparent 60%),var(--bg);
  min-height:100vh;line-height:1.42; overflow-x:hidden;}

#app { transition: opacity 0.3s ease; }
#app.enter { animation: popIn 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
@keyframes popIn {
  0% { opacity: 0; transform: translateY(10px) scale(0.99); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.wrap{max-width:1600px;margin:0 auto;padding:0 16px 80px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:.01em}
.who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem}
select,input{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%; transition: border-color 0.2s ease;}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }

button{
  font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:6px 12px;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease,filter .2s ease,background-color .2s ease,opacity .2s ease,border-color .2s ease;
}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 16px rgba(255,45,149,.25)}
button:active:not(:disabled){transform:scale(.92);box-shadow:none}

button.primary{background:#9e134c;border-color:#9e134c;color:#fff;font-weight:700}
button.ghost{background:transparent}
button.danger{color:#ffb3b3}
button:disabled{opacity:.35;cursor:not-allowed;transform:none!important;box-shadow:none!important}

.hero{
  font-family:var(--display);font-weight:800;font-size:clamp(2.8rem,8vw,5.6rem);line-height:1.05;margin:48px 0 24px;letter-spacing:-.02em;
  text-align:center;
  background:linear-gradient(135deg, #ff2d95 0%, #ffd166 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

h2{font-family:var(--display);font-size:1.5rem;margin:24px 0 4px}
h3{font-family:var(--display);margin:0 0 12px}
.hint{color:var(--muted);margin:0 0 14px;font-size:.9rem}
.yeartitle{font-family:var(--display);font-weight:800;font-size:clamp(2rem,6vw,3.4rem);margin:12px 0 16px;letter-spacing:-.01em}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}

.yearcard{cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:24px;min-height:140px;justify-content:center; transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease, border-color 0.25s ease;}
.yearcard:hover{transform:translateY(-6px); box-shadow:0 12px 24px rgba(0,0,0,0.4); border-color:var(--gold);}
.yearcard:active{transform:scale(0.96);}
.yearcard b{font-family:var(--display);font-size:2.2rem}
.yearcard span{color:var(--muted);font-size:1rem}

.fab{position:fixed;bottom:32px;right:32px;width:64px;height:64px;border-radius:50%;background:var(--pink);color:#fff;font-size:2.4rem;display:grid;place-items:center;border:none;box-shadow:0 10px 28px rgba(255,45,149,0.5);z-index:100;cursor:pointer;padding:0;margin:0}
.fab:hover{transform:scale(1.1) rotate(90deg);box-shadow:0 14px 32px rgba(255,45,149,0.7)}

.main-actions{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:32px;justify-content:center}
.main-actions button{font-family:var(--display);font-weight:700;font-size:1.15rem;padding:14px 24px;border-radius:12px;flex:1;max-width:300px;min-width:220px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs button{border-radius:999px;background:transparent}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.tabs button.final-tab{border-color:var(--gold);color:var(--gold);font-weight:700}
.tabs button.final-tab.on{background:var(--gold);color:var(--bg);border-color:var(--gold)}

.list{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px}
@media(max-width:1300px){.list{grid-template-columns:1fr}}

@keyframes simpleFadeUp { 
  from { opacity: 0; transform: translateY(8px); } 
  to { opacity: 1; transform: translateY(0); } 
}
.row{
  display:grid;
  grid-template-columns:44px 1fr auto;
  gap:12px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 12px;
  align-items:center;
  animation: simpleFadeUp 0.3s ease-out backwards;
}

@media(max-width:700px){
  .row{grid-template-columns:1fr;gap:8px}
  .pl{justify-self:start!important}
}

.no{
  font-family:var(--display);
  font-weight:800;
  font-size:0.95rem;
  color:var(--muted);
  background:var(--panel2);
  border-radius:8px;
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  border:1px solid transparent;
  flex-shrink:0;
  transition:color 0.2s, border-color 0.2s;
}
.no:hover{border-color:var(--gold);color:var(--gold)}

.row-content{
  display:flex;
  flex-direction:column;
  gap:6px;
  min-width:0;
}

.meta{display:flex;align-items:center;gap:8px;font-size:0.95rem;flex-wrap:wrap;min-width:0}
.meta b{font-size:1.05rem}
.flag{width:22px;height:15px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.25);vertical-align:middle;transform:scale(1.2);display:inline-block;margin:0 2px}

.stats{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.tiles{display:flex;gap:4px}

/* Geteilte Kacheln (Split-Tiles Design) */
.tile{
  width:46px;
  height:50px;
  border-radius:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  border:2px solid transparent;
  padding:0;
  line-height:1;
  font-family:inherit;
  overflow:hidden;
}
.tile small{
  font-size:0.6rem;
  font-weight:700;
  width:100%;
  text-align:center;
  padding:3px 0;
  background: rgba(0,0,0,0.22);
  border-bottom: 1px solid rgba(0,0,0,0.15);
}
.tile.empty small{
  background: rgba(255,255,255,0.06);
  border-bottom-color: var(--line);
}
.tile b{
  font-family:var(--number-font); 
  font-size:1.35rem; 
  letter-spacing:0.05em;
  margin-bottom:3px;
}
.tile.empty{background:var(--panel2);color:var(--muted)}
.tile.me{border-color:#fff}

.avg{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:44px}
.avg b{font-family:var(--display);font-size:1.15rem}
.avg small{font-size:0.6rem;color:var(--muted);letter-spacing:.04em}

.pl{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  justify-self:end;
}
.pl input{width:56px;height:44px;text-align:center;font-family:var(--display);font-size:1.25rem;font-weight:800;color:var(--gold);background:var(--bg);border:2px solid var(--gold);border-radius:10px;padding:0}
.pl small{font-size:0.6rem;color:var(--gold);font-weight:700;letter-spacing:.05em}

.rate{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  padding-top:6px;
  border-top:1px solid var(--line);
  width:100%;
  grid-column:1/-1;
}
.pt{width:34px;height:34px;padding:0;border:2px solid transparent;font-family:var(--number-font);font-size:1.2rem;opacity:.5}
.pt:hover:not(:disabled){opacity:.9}
.pt.on{opacity:1;border-color:#fff;box-shadow:0 0 0 2px var(--pink)}

.notes{
  color:var(--muted);
  font-size:0.8rem;
  display:flex;
  flex-wrap:wrap;
  gap:4px 12px;
  grid-column:1/-1;
}

.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:.85rem}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
td.c,th.c{text-align:center}
.cell{display:inline-block;min-width:34px;padding:3px 8px;border-radius:8px;font-family:var(--number-font);font-size:1.1rem;text-align:center}
td input[type=number]{width:72px}
.dup{border-color:#ff6b6b;color:#ffb3b3}
.verdict{margin-top:14px;padding:16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:1.05rem}
.verdict b{font-family:var(--display);font-size:1.3rem}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.seg button.on{background:var(--pink);border-color:var(--pink);font-weight:700}
.q{display:inline-block;background:#1f9d55;color:#fff;border-radius:4px;padding:0 4px;font-size:0.65rem;font-weight:800;margin-left:4px;white-space:nowrap;flex-shrink:0}
.autofinal{display:inline-block;background:#7b2cbf;color:#fff;border-radius:4px;padding:0 4px;font-size:0.65rem;font-weight:800;margin-left:4px;white-space:nowrap;flex-shrink:0}
.rank{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.rank .p{font-family:var(--display);font-weight:800;font-size:1.3rem;width:36px;color:var(--gold)}
.vs{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(440px,92vw)}
dialog.wide{width:min(680px,92vw)}
dialog::backdrop{background:rgba(5,2,15,.85);backdrop-filter:blur(4px);animation:fadeIn .25s ease}
dialog label{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;color:var(--muted);font-size:.88rem}
dialog input,dialog select{width:100%}
.preset-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;margin:12px 0 16px}
.preset-btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--display);font-weight:700;color:var(--ink);cursor:pointer;text-align:center;font-size:1.1rem}
.preset-btn:hover{border-color:var(--pink);background:rgba(255,45,149,.15)}

.empty{color:var(--muted);padding:20px 0}
.sm-group{display:flex;gap:4px;margin-left:auto;flex-shrink:0}
.sm{padding:2px 6px;font-size:0.75rem}
.prow{display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--line)}
.pbtn{flex:1;display:flex;gap:10px;align-items:center;text-align:left;background:transparent;border:0;padding:8px 4px}
.pbtn small{color:var(--muted)}
#plist{max-height:55vh;overflow:auto;margin:10px 0}
.net{font-size:.8rem}

/* Overview Layout: Lückenlos & mit Song-Details gefüllt */
.ov-grid-side{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:24px;margin-top:16px}
@media(max-width:1200px){.ov-grid-side{grid-template-columns:1fr}}
.ov-column{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.ov-col-title{font-family:var(--display);font-weight:800;font-size:1.1rem;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;margin-bottom:16px;color:var(--ink)}

.ov-headers-row{display:flex;justify-content:space-between;align-items:center;padding:0 8px 6px;color:var(--muted);font-size:0.8rem;font-weight:700}
.ov-row-item{display:flex;align-items:center;gap:4px;margin-bottom:8px;justify-content:space-between}
.ov-pts{display:flex;gap:4px}
.ov-pt{width:34px;height:34px;display:grid;place-items:center;font-family:var(--number-font);font-size:1.1rem;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.ov-pt.none{color:var(--muted);opacity:0.4}
.ov-no{width:26px;text-align:center;font-weight:700;color:var(--muted);font-size:0.85rem;display:none;}
.ov-pill{flex:1;height:38px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 10px;font:700 0.85rem var(--display);overflow:hidden;}
.ov-pill .song-info{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;}
.ov-pill .song-info span{overflow:hidden;text-overflow:ellipsis;font-size:0.8rem;font-weight:400;color:var(--muted);}
.ov-pill .song-info b{font-size:0.85rem;color:var(--ink);font-weight:600;}
.ov-pill.out{opacity:0.4;background:var(--bg)}
.ov-pill .flag{width:22px;height:15px;object-fit:cover;border-radius:2px;flex-shrink:0;}
.ov-place{width:36px;text-align:center;font-weight:800;color:var(--gold);font-size:0.9rem}

.row.winner{border-color:var(--gold);box-shadow:0 0 15px rgba(255,209,102,.3)}
.row.autofinal-row{border-color:#9d4edd}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
</div>
<button class="fab" data-act="openNewYearDlg" title="Add new contest">＋</button>
<dialog id="dlg"></dialog>

<script>
var COUNTRIES=[
  ["af","Afghanistan"],["al","Albania"],["am","Armenia"],["au","Australia"],["at","Austria"],["az","Azerbaijan"],
  ["bh","Bahrain"],["bd","Bangladesh"],["by","Belarus"],["be","Belgium"],["bt","Bhutan"],["ba","Bosnia and Herzegovina"],
  ["bn","Brunei"],["bg","Bulgaria"],["kh","Cambodia"],["cn","China"],["hr","Croatia"],["cy","Cyprus"],["cz","Czechia"],
  ["dk","Denmark"],["ee","Estonia"],["fi","Finland"],["fr","France"],["ge","Georgia"],["de","Germany"],["gr","Greece"],
  ["hk","Hong Kong"],["hu","Hungary"],["is","Iceland"],["in","India"],["id","Indonesia"],["ir","Iran"],["iq","Iraq"],
  ["ie","Ireland"],["il","Israel"],["it","Italy"],["jp","Japan"],["jo","Jordan"],["kz","Kazakhstan"],["kw","Kuwait"],
  ["kg","Kyrgyzstan"],["la","Laos"],["lb","Lebanon"],["lv","Latvia"],["lt","Lithuania"],["lu","Luxembourg"],["mo","Macau"],
  ["my","Malaysia"],["mv","Maldives"],["mt","Malta"],["md","Moldova"],["mc","Monaco"],["mn","Mongolia"],["me","Montenegro"],
  ["ma","Morocco"],["mm","Myanmar"],["np","Nepal"],["nl","Netherlands"],["nz","New Zealand"],["kp","North Korea"],
  ["mk","North Macedonia"],["no","Norway"],["om","Oman"],["pk","Pakistan"],["ps","Palestine"],["ph","Philippines"],
  ["pl","Poland"],["pt","Portugal"],["qa","Qatar"],["ro","Romania"],["ru","Russia"],["sa","Saudi Arabia"],["sm","San Marino"],
  ["rs","Serbia"],["sg","Singapore"],["sk","Slovakia"],["si","Slovenia"],["es","Spain"],["lk","Sri Lanka"],["se","Sweden"],
  ["ch","Switzerland"],["sy","Syria"],["tw","Taiwan"],["tj","Tajikistan"],["th","Thailand"],["tr","Türkiye"],
  ["tm","Turkmenistan"],["ua","Ukraine"],["ae","United Arab Emirates"],["gb","United Kingdom"],["uz","Uzbekistan"],
  ["vn","Vietnam"],["ye","Yemen"]
];

var CN={};
for(var i=0; i<COUNTRIES.length; i++){ CN[COUNTRIES[i][0]] = COUNTRIES[i][1]; }

var SHOWS={sf1:"Semi-final 1",sf2:"Semi-final 2",final:"Final"};
var DEF_N={sf1:15,sf2:15,final:26};
var KEY="esc-scoreboard-v2",MEKEY="esc-me";

var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s ? s : "").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});};

function fresh(){
  var jList = [];
  for(var i=1; i<=4; i++){ jList.push({id:"j"+i, name:"Player "+i}); }
  return {jury:jList, songs:[], years:[], ratings:{}, pred:{}, notes:{}, qualPred:{}};
}
function load(){
  try{
    var d=JSON.parse(localStorage.getItem(KEY));
    if(d && d.jury){ d.notes = d.notes || {}; d.qualPred = d.qualPred || {}; return d; }
  }catch(e){}
  return fresh();
}
var S=load();
var me=localStorage.getItem(MEKEY)||"j1";
var ui={big:null,q:"",view:"home",yearId:null,tab:"sf1",subTab:"points",ovSubTab:"semis",sbShow:"final",editMode:false,bA:null,bB:null,assign:null,editSong:null,pickE:null,pickJur:null,libYear:"",libSort:"name",compareCc:null,enter:false};

function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){showAlert("Error", "Could not save in this browser.");}push();}

function getRatings(e){
  if(!e) return {};
  if(e.songId && S.ratings[e.songId]) return S.ratings[e.songId];
  if(S.ratings[e.id]) return S.ratings[e.id];
  return {};
}

function getNotes(e){
  if(!e) return {};
  if(e.songId && S.notes[e.songId]) return S.notes[e.songId];
  if(S.notes[e.id]) return S.notes[e.id];
  return {};
}

function getQualPred(e){
  if(!e) return {};
  if(S.qualPred[e.id]) return S.qualPred[e.id];
  return {};
}

var dlg=$("#dlg");
dlg.addEventListener("close",function(){render();});
var _pendingConfirmCallback = null;

function showAlert(title, text) {
  dlg.className = "";
  dlg.innerHTML = '<h3>' + esc(title) + '</h3>' +
    '<p class="hint">' + esc(text) + '</p>' +
    '<div class="actions"><button class="primary" data-act="closeDlg">OK</button></div>';
  if (!dlg.open) dlg.showModal();
}

function openConfirm(title, text, onYes) {
  _pendingConfirmCallback = onYes;
  dlg.className = "";
  dlg.innerHTML = '<h3>' + esc(title) + '</h3>' +
    '<p class="hint">' + esc(text) + '</p>' +
    '<div class="actions">' +
      '<button class="ghost" data-act="closeDlg">Cancel</button>' +
      '<button class="primary" data-act="confirmYes">Confirm</button>' +
    '</div>';
  if (!dlg.open) dlg.showModal();
}

var DB=(localStorage.getItem("esc-db")||"https://esc-connect-7bdfe-default-rtdb.europe-west1.firebasedatabase.app").replace(/\/+$/,"");
var lastFlat={},busy=0,net=DB?"connecting":"local";
var netText=function(){return {local:"Local only",connecting:"Connecting…",online:"● Shared",error:"Offline, retrying"}[net];};
var badge=function(){var n=$("#net");if(n)n.textContent=netText();};

function toTree(){
  var t={jury:{},songs:{},years:{},ratings:S.ratings,notes:S.notes,pred:S.pred,qualPred:S.qualPred};
  for(var i=0; i<S.jury.length; i++){ t.jury[S.jury[i].id] = {name:S.jury[i].name}; }
  for(var i=0; i<S.songs.length; i++){ var x = S.songs[i]; t.songs[x.id] = {cc:x.cc, artist:x.artist, title:x.title, year:x.year}; }
  for(var i=0; i<S.years.length; i++){
    var y = S.years[i];
    var o={year:y.year, suffix:y.suffix, city:y.city, shows:{}};
    for(var sh in y.shows){
      o.shows[sh]={};
      var shList = y.shows[sh];
      for(var k=0; k<shList.length; k++){
        var e = shList[k]; o.shows[sh][e.id] = {n:e.customNo || idx(e.id), songId:e.songId, place:e.place, dq:e.dq, autoFinal: e.autoFinal};
      }
    }
    t.years[y.id]=o;
  }
  return t;
}

function flat(o,p,out){
  p=p||""; out=out||{};
  for(var k in o){
    var v=o[k],q=p?p+"/"+k:k;
    if(v&&typeof v==="object")flat(v,q,out);
    else if(v!==undefined&&v!==null&&v!=="")out[q]=v;
  }
  return out;
}

function fromTree(t){
  var r=fresh(),ju=t.jury||{};
  for(var i=0; i<r.jury.length; i++){ if(ju[r.jury[i].id] && ju[r.jury[i].id].name) r.jury[i].name = ju[r.jury[i].id].name; }
  r.songs=[]; var tSongs = t.songs || {};
  for(var id in tSongs){ if(tSongs.hasOwnProperty(id)) r.songs.push(Object.assign({id:id}, tSongs[id])); }
  r.years=[]; var tYears = t.years || {};
  for(var id in tYears){
    if(tYears.hasOwnProperty(id)){
      var o = tYears[id]; var shows={};
      for(var sh in SHOWS){
        var shObj = (o.shows || {})[sh] || {}; var arr = [];
        for(var id2 in shObj){ if(shObj.hasOwnProperty(id2)){ var e = shObj[id2]; arr.push({id:id2, songId:e.songId, place:e.place, customNo:e.n, dq:e.dq, autoFinal: e.autoFinal}); } }
        arr.sort(function(a,b){
          var na = a.customNo || idx(a.id), nb = b.customNo || idx(b.id);
          if(!isNaN(na) && !isNaN(nb)) return na - nb;
          return String(na).localeCompare(String(nb));
        });
        shows[sh] = arr;
      }
      r.years.push({id:id, year:+o.year||+id.split("_")[0], suffix:o.suffix||"", city:o.city, shows:shows});
    }
  }
  r.years.sort(function(a,b){return b.year-a.year||b.id.localeCompare(a.id);});
  r.ratings=t.ratings||{}; r.notes=t.notes||{}; r.pred=t.pred||{}; r.qualPred=t.qualPred||{};
  return r;
}

function same(a,b){
  var k=Object.keys(a); if(k.length !== Object.keys(b).length) return false;
  for(var i=0; i<k.length; i++){ if(a[k[i]] !== b[k[i]]) return false; }
  return true;
}

function push(){
  if(!DB)return;
  var cur=flat(toTree()),p={};
  for(var k in cur)if(cur[k]!==lastFlat[k])p[k]=cur[k];
  for(var k in lastFlat)if(!(k in cur))p[k]=null;
  if(!Object.keys(p).length)return;
  var prev=lastFlat;lastFlat=cur;busy++;
  fetch(DB+"/.json",{method:"PATCH",body:JSON.stringify(p)}).then(function(r){if(!r.ok)throw 0;net="online";}).catch(function(){lastFlat=prev;net="error";}).finally(function(){busy--;badge();});
}

function pull(first){
  if(!DB||busy)return;
  fetch(DB+"/.json").then(function(res){return res.json();}).then(function(t){
    net="online";
    if(!t){if(first===true)push();badge();return;}
    var f=flat(t);
    if(same(f,lastFlat)){badge();return;}
    var a=document.activeElement;
    if(first!==true&&(dlg.open||(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))))return;
    S=fromTree(t);lastFlat=f;
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    render();
  }).catch(function(){net="error";badge();});
}

var flag=function(cc){return '<img class="flag" data-cc="'+cc+'" src="https://flagcdn.com/'+cc+'.svg" alt="'+cc.toUpperCase()+'" loading="lazy" onerror="flagFb(this)">';};
function flagFb(i){
  var cc=i.dataset.cc;
  if(!i.dataset.s){i.dataset.s=1;i.removeAttribute("srcset");i.src="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/flags/4x3/"+cc+".svg";return;}
  var sp=document.createElement("span");
  var chars = cc.toUpperCase().split("");
  var text = "";
  for(var k=0; k<chars.length; k++){ text += String.fromCodePoint(127397 + chars[k].charCodeAt(0)); }
  sp.textContent = text + " ";
  i.replaceWith(sp);
}

var pc=function(p){
  var t=Math.max(0,Math.min(1,(p-1)/9));
  var R=[214,40,57],W=[255,255,255],G=[24,150,80];
  var mix=function(a,b,k){return [Math.round(a[0]+(b[0]-a[0])*k), Math.round(a[1]+(b[1]-a[1])*k), Math.round(a[2]+(b[2]-a[2])*k)];};
  var rgb=t<.5?mix(R,W,t*2):mix(W,G,(t-.5)*2);
  var r=rgb[0],g=rgb[1],b=rgb[2];
  var lum=(r*299+g*587+b*114)/1000;
  var style = "background:rgb("+r+","+g+","+b+");color:"+(lum>150?"#1d1d1d":"#fff");
  if(Number(p) === 10){ style += ";border:2.5px solid var(--gold);box-shadow:0 0 10px rgba(255,209,102,0.8)"; }
  return style;
};

function battle(){
  var y=yearObj(ui.yearId), allFin=y.shows.final;
  var fin = [];
  for(var i=0; i<allFin.length; i++){if(songById(allFin[i].songId) && !allFin[i].dq) fin.push(allFin[i]);}

  ui.bA = ui.bA || (me==="admin"?S.jury[0].id:me);
  if(!ui.bB || ui.bB===ui.bA){
    for(var i=0; i<S.jury.length; i++){if(S.jury[i].id!==ui.bA){ui.bB=S.jury[i].id;break;}}
  }
  var A=ui.bA, B=ui.bB;

  var sel = function(k, v){
    var opts="";
    for(var i=0; i<S.jury.length; i++){
      var j=S.jury[i];
      opts+='<option value="'+j.id+'" '+(j.id===v?"selected":"")+'>'+esc(j.name)+'</option>';
    }
    return '<select data-chg="'+k+'">'+opts+'</select>';
  };

  var dupSet = function(j){
    var c={};
    for(var i=0; i<fin.length; i++){
      var v=(S.pred[fin[i].id]||{})[j];
      if(v) c[v]=(c[v]||0)+1;
    }
    return c;
  };
  var dA=dupSet(A), dB=dupSet(B);
  var sa=0, sb=0, n=0;

  var rows="";
  for(var i=0; i<fin.length; i++){
    var e=fin[i], s=songById(e.songId), p=S.pred[e.id]||{}, a=p[A], b=p[B], act=e.place;
    var da=a&&act?Math.abs(a-act):null, db=b&&act?Math.abs(b-act):null;
    if(da!=null&&db!=null){sa+=da; sb+=db; n++;}
    
    var dcell = function(d){return d==null?"–":d===0?'<span class="cell" style="'+pc(10)+'">🎯 0</span>':'<span class="cell" style="'+pc(Math.max(1,10-d))+'">'+d+'</span>';};
    var inp = function(j,v,dups){var valStr=(v!==undefined&&v!==null)?v:""; return '<input type="number" min="1" max="'+fin.length+'" value="'+valStr+'" class="'+(v&&dups[v]>1?"dup":"")+'" data-chg="pred" data-e="'+e.id+'" data-j="'+j+'">';};
    var placeActStr = (act!==undefined&&act!==null)?act:"–";
    rows+='<tr><td>'+flag(s.cc)+' '+esc(CN[s.cc])+'</td><td>'+inp(A,a,dA)+'</td><td>'+inp(B,b,dB)+'</td><td class="c">'+placeActStr+'</td><td class="c">'+dcell(da)+'</td><td class="c">'+dcell(db)+'</td></tr>';
  }

  var verdict='<span class="hint">Enter actual final places to see results.</span>';
  if(n>0){
    var done=n===fin.length?"":' <span class="hint">('+n+' of '+fin.length+' compared)</span>';
    if(sa===sb) verdict='<b>It\'s a draw!</b> Both have '+sa+' points.'+done;
    else if(sa<sb) verdict='<b>👑 '+esc(jname(A))+' wins</b> with '+sa+' points.'+done;
    else verdict='<b>👑 '+esc(jname(B))+' wins</b> with '+sb+' points.'+done;
  }
  return '<h2>Points battle</h2><p class="hint">Predict final placements beforehand.</p>'+
  '<div class="vs">'+sel("bA",A)+' <b>vs</b> '+sel("bB",B)+'</div>'+
  (fin.length?'<div class="tw" style="margin-top:12px"><table><thead><tr><th>Country</th><th>'+esc(jname(A))+'</th><th>'+esc(jname(B))+'</th><th class="c">Actual</th><th class="c">'+esc(jname(A))+' Pts</th><th class="c">'+esc(jname(B))+' Pts</th></tr></thead>'+
  '<tbody>'+rows+'</tbody></table></div>'+
  '<div class="verdict">'+verdict+'</div>'
  :'<p class="empty">Please select songs for the final first.</p>');
}

function openSettings(){
  var jLabels = ""; for(var i=0; i<S.jury.length; i++){ jLabels += '<label>'+S.jury[i].id.toUpperCase()+' Name<input data-jn="'+S.jury[i].id+'" value="'+esc(S.jury[i].name)+'"></label>'; }
  dlg.className="";
  dlg.innerHTML='<h3>Settings</h3>'+jLabels+'<label>Database URL<input id="dburl" value="'+esc(DB)+'"></label>'+
   '<div class="actions"><button data-act="export">Export</button><label style="background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;flex:1;text-align:center">Import<input id="imp" type="file" style="display:none"></label></div>'+
   '<div class="actions"><button class="ghost" data-act="closeDlg">Close</button><button class="primary" data-act="saveNames">Save</button></div>';
  if(!dlg.open)dlg.showModal();
  
  // MERGE IMPORT LOGIC IMPLEMENTED HERE:
  $("#imp").addEventListener("change",function(ev){
    var f=ev.target.files[0]; if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var imported=JSON.parse(r.result);
        
        // Merge jury
        var juryMap={};
        S.jury.forEach(function(j){ juryMap[j.id]=j; });
        if(imported.jury){ imported.jury.forEach(function(j){ juryMap[j.id]=j; }); }
        S.jury=Object.values(juryMap);

        // Merge songs
        var songMap={};
        S.songs.forEach(function(s){ songMap[s.id]=s; });
        if(imported.songs){ imported.songs.forEach(function(s){ songMap[s.id]=s; }); }
        S.songs=Object.values(songMap);

        // Merge years
        var yearMap={};
        S.years.forEach(function(y){ yearMap[y.id]=y; });
        if(imported.years){ imported.years.forEach(function(y){ yearMap[y.id]=y; }); }
        S.years=Object.values(yearMap);
        S.years.sort(function(a,b){return b.year-a.year||b.id.localeCompare(a.id);});

        // Merge ratings, notes, pred, qualPred
        ['ratings','notes','pred','qualPred'].forEach(function(key){
          S[key]=S[key]||{};
          if(imported[key]){
            for(var id in imported[key]){
              if(imported[key].hasOwnProperty(id)){
                S[key][id]=Object.assign({}, S[key][id]||{}, imported[key][id]);
              }
            }
          }
        });

        save();
        dlg.close();
        render();
        showAlert("Erfolg", "Daten wurden erfolgreich zusammengeführt (gemergt)!");
      }catch(e){showAlert("Error","Ungültige Datei");}
    };
    r.readAsText(f);
  });
}

    for(var sh in SHOWS){
      shows[sh]=[];
      for(var i=1; i<=DEF_N[sh]; i++){ shows[sh].push({id:id+"-"+sh+"-"+i}); }
    }
    S.years.push({id:id,year:yNum,suffix:suffix,city:$("#ny_city").value.trim()||undefined,shows:shows});
    S.years.sort(function(a,b){return b.year-a.year;});
    save(); dlg.close(); ui.yearId=id; ui.view="year"; ui.tab="sf1"; ui.subTab="points"; ui.ovSubTab="semis"; ui.enter=true;
  },
  delYear:function(){
    var y=yearObj(ui.yearId);
    openConfirm("Delete Contest","Really delete contest?",function(){
      S.years=S.years.filter(function(x){return x!==y;});save();ui.yearId=null;ui.view="home";ui.enter=true;render();
    });
    return "keep";
  },
  rate:function(t){
    var id=t.dataset.e, p=+t.dataset.p;
    var e=findEntry(id), targetJur = (me === "admin" && ui.pickJur) ? ui.pickJur : me;
    var key = (e && e.songId) ? e.songId : id;
    S.ratings[key]=S.ratings[key]||{};
    if(S.ratings[key][targetJur]===p) delete S.ratings[key][targetJur];
    else S.ratings[key][targetJur]=p;
    ui.pickE=null; ui.pickJur=null; save();
  },
  moveUp:function(t){
    var y=yearObj(ui.yearId), l=y.shows[t.dataset.show], idx_pos=+t.dataset.idx;
    if(idx_pos>0){ var tmp=l[idx_pos]; l[idx_pos]=l[idx_pos-1]; l[idx_pos-1]=tmp; save(); }
  },
  moveDown:function(t){
    var y=yearObj(ui.yearId), l=y.shows[t.dataset.show], idx_pos=+t.dataset.idx;
    if(idx_pos<l.length-1){ var tmp=l[idx_pos]; l[idx_pos]=l[idx_pos+1]; l[idx_pos+1]=tmp; save(); }
  },
  addSlot:function(t){
    var y=yearObj(ui.yearId), l=y.shows[t.dataset.show];
    l.push({id:y.id+"-"+t.dataset.show+"-"+(l.length+1)}); save();
  },
  delSlot:function(t){
    var y=yearObj(ui.yearId), l=y.shows[t.dataset.show];
    if(l.length<=1)return; l.pop(); save();
  },
  editNo:function(t){ openEditNo(t.dataset.e); return "keep"; },
  saveCustomNo:function(t){
    var e=findEntry(t.dataset.e), inp=$("#custom_no_input"), afChk=$("#custom_autofinal_input");
    if(e){
      if(inp){ var v=inp.value.trim(); if(!v||v===String(idx(e.id))) delete e.customNo; else e.customNo=v; }
      if(afChk){ e.autoFinal=afChk.checked; }
      save();
    }
    dlg.close();
  },
  toggleDq:function(t){ var e=findEntry(t.dataset.e); e.dq=!e.dq; save(); },
  addSong:function(){openSong(null,ui.assign);return "keep";},
  editSong:function(t){openSong(t.dataset.id,null);return "keep";},
  pick:function(t){openPicker(t.dataset.e);return "keep";},
  choose:function(t){
    var e=findEntry(ui.assign), id=t.dataset.id;
    e.songId=id; save(); dlg.close(); return "keep";
  },
  delSong:function(t){
    var id=t.dataset.id;
    openConfirm("Delete Song","Delete from library?",function(){
      S.songs=S.songs.filter(function(x){return x.id!==id;}); save(); fillList();
    });
    return "keep";
  },
  saveSong:function(){
    var artist=$("#f_artist").value.trim(), title=$("#f_title").value.trim(), cc=$("#f_cc").value;
    var songYear=parseInt($("#f_song_year").value)||new Date().getFullYear();
    if(!artist||!title) return "keep";
    if(ui.editSong){ var x=songById(ui.editSong); x.artist=artist; x.title=title; x.cc=cc; x.year=songYear; }
    else {
      var id="s"+Date.now().toString(36);
      S.songs.push({id:id,cc:cc,artist:artist,title:title,year:songYear});
      if(ui.assign){ var e=findEntry(ui.assign); if(e) e.songId=id; }
    }
    save(); if(ui.assign) dlg.close(); else render(); return "keep";
  },
  editCity:function(){
    var y=yearObj(ui.yearId);
    dlg.className="";
    dlg.innerHTML='<h3>Host City</h3><label>City<input id="city_input" value="'+esc(y.city||"")+'"></label><div class="actions"><button class="ghost" data-act="closeDlg">Cancel</button><button class="primary" data-act="saveCity">Save</button></div>';
    if(!dlg.open) dlg.showModal(); return "keep";
  },
  saveCity:function(){ var y=yearObj(ui.yearId), inp=$("#city_input"); if(y&&inp){ y.city=inp.value.trim()||undefined; save(); } dlg.close(); },
  closeDlg:function(){dlg.close();return "keep";},
  confirmYes:function(){ dlg.close(); if(_pendingConfirmCallback){ var cb=_pendingConfirmCallback; _pendingConfirmCallback=null; cb(); } return "keep"; },
  settings:function(){openSettings();return "keep";},
  saveNames:function(){
    var inputs = document.querySelectorAll("[data-jn]");
    for(var i=0; i<inputs.length; i++){
      var jId = inputs[i].dataset.jn, val = inputs[i].value.trim();
      if(val){ for(var k=0; k<S.jury.length; k++){ if(S.jury[k].id===jId) S.jury[k].name=val; } }
    }
    save(); dlg.close(); return "keep";
  },
  export:function(){
    var blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="esc.json"; a.click(); return "keep";
  }
};

document.addEventListener("input",function(ev){
  if(ev.target.id === "lib_search_input"){ ui.q = ev.target.value; render(); var inp=$("#lib_search_input"); if(inp){ inp.focus(); inp.selectionStart=inp.selectionEnd=inp.value.length; } }
});

document.addEventListener("change",function(ev){
  if(ev.target.id === "lib_year_select"){ ui.libYear = ev.target.value; render(); }
  var t=ev.target.closest("[data-chg]"); if(!t) return;
  if(C[t.dataset.chg](t)!=="keep") render();
});

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-act]"); 
  if(!t||!A[t.dataset.act]) return;
  var r=A[t.dataset.act](t);
  if(r!=="keep") render();
});

var C={
  note:function(t){
    var id=t.dataset.e, v=t.value.trim(), e=findEntry(id), targetJur=t.dataset.jur||me;
    var key = (e && e.songId) ? e.songId : id;
    S.notes[key]=S.notes[key]||{};
    if(v) S.notes[key][targetJur]=v; else delete S.notes[key][targetJur];
    save();
  },
  place:function(t){ var e=findEntry(t.dataset.e), v=parseInt(t.value); if(v>0) e.place=v; else delete e.place; save(); },
  pred:function(t){ var id=t.dataset.e, j=t.dataset.j, v=parseInt(t.value); S.pred[id]=S.pred[id]||{}; if(v>0) S.pred[id][j]=v; else delete S.pred[id][j]; save(); },
  bA:function(t){ui.bA=t.value;},
  bB:function(t){ui.bB=t.value;},
  compareCc:function(t){ui.compareCc=t.value;render();}
};

render();
checkFirstJoin();
if(DB){pull(true);setInterval(pull,4000);}
</script>
</body>
</html>
